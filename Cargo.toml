[package]
name = "hololive-ocg-tracker"
version = "0.1.0"
edition = "2021"
description = "Hololive Official Card Game local collection tracker with Rust, SQLite3, and Material Design 3"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
libc = "0.2.186"
parking_lot = "0.12.5"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors"] }

[dev-dependencies]
tempfile = "3.27.0"
