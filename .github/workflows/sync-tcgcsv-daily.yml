name: Sync Hololive OCG Catalog & Prices (TCGCSV → Firestore)

on:
  schedule:
    # TCGCSV updates prices daily around 20:00:00 UTC
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      force_editions:
        description: 'Forzar reescritura de todas las ediciones en Firestore'
        type: boolean
        required: false
        default: false

jobs:
  sync-tcgcsv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-sync.txt'

      - name: Install sync dependencies
        run: python -m pip install --upgrade pip && pip install -r scripts/requirements-sync.txt

      - name: Verify Firebase Service Account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT en GitHub (Settings -> Secrets and variables -> Actions)."
            echo "Genera la clave JSON en Firebase Console -> Configuracion del proyecto -> Cuentas de servicio -> Generar nueva clave privada."
            exit 1
          fi

      - name: Fetch TCGCSV (category 87) & sync to Cloud Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: hololive-ocg-tracker-sb
        run: |
          FLAGS=""
          if [ "${{ inputs.force_editions }}" = "true" ]; then
            FLAGS="--force-editions"
          fi
          python3 scripts/sync_tcgcsv_to_firestore.py $FLAGS
